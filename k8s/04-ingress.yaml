apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: buffering-middleware
  namespace: wedding
spec:
  buffering:
    maxRequestBodyBytes: 52428800 # 50MB for Base64 wishes
    memRequestBodyBytes: 2097152  # 2MB memory buffer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wedding-ingress
  namespace: wedding
  annotations:
    # Traefik (Default k3s ingress) configuration
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: wedding-buffering-middleware@kubernetescrd
    
    # NGINX Ingress fallback annotations
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "backend-service"
spec:
  rules:
    - http:
        paths:
          # Socket.io real-time connection
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          # Backend REST APIs (e.g., /api/wishes, /api/health)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          # Frontend Pages & Assets (/, /guest, /display, /_next, etc.)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
